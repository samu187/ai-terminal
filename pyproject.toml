[project]
name = "ai-terminal"
version = "0.1.1"
description = "A safe, concise Codex terminal assistant"
readme = "README.md"
authors = [
    { name = "samu187", email = "samuel-alciati@live.it" }
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.17,<1",
]

[project.scripts]
ai = "ai_terminal.cli:main"

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"
